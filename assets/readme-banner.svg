<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">cc-hero — Claude codes. You shred.</title>
  <desc id="description">Terminal arcade artwork: six guitar strings, scrolling tablature, and a bright green playhead. Guitar practice inside Claude Code.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bac6b2" opacity=".07"/>
    </pattern>
    <linearGradient id="ambient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101713"/>
      <stop offset="1" stop-color="#1c2b1e"/>
    </linearGradient>
    <linearGradient id="trail">
      <stop stop-color="#c4f578" stop-opacity="0"/>
      <stop offset="1" stop-color="#c4f578" stop-opacity=".16"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-30%" width="300%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="20" fill="url(#ambient)"/>
  <rect width="1600" height="560" rx="20" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1599" height="559" rx="19.5" fill="none" stroke="#3d4b35"/>
  <path d="M64 96H1536M64 484H1536" stroke="#43513a"/>

  <!-- A guitar pick carrying a terminal prompt: the project mark. -->
  <g transform="translate(64 26)">
    <path d="M24 0C11 0 1 5 1 16c0 14 16 34 23 34s23-20 23-34C47 5 37 0 24 0Z" fill="#c4f578"/>
    <path d="m13 13 7 6-7 6m12 0h9" fill="none" stroke="#172014" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="2">
    <text x="132" y="58" fill="#efeedd">GUITAR PRACTICE / CLAUDE CODE</text>
    <text x="1536" y="58" text-anchor="end" fill="#a3b099">AETHERWING · EARLY ACCESS</text>
  </g>

  <text x="64" y="253" font-family="Menlo, Consolas, monospace" font-size="142" font-weight="700" letter-spacing="-10" fill="#efeedd">cc-<tspan fill="#c4f578">hero</tspan></text>
  <text x="69" y="321" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="39" font-weight="500" letter-spacing="-.6" fill="#efeedd">Claude codes. You shred.</text>
  <text x="70" y="365" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#a3b099">Your guitar. Your terminal. One more run.</text>

  <rect x="70" y="405" width="338" height="49" rx="7" fill="#101713" stroke="#59654b"/>
  <g font-family="Menlo, Consolas, monospace" font-size="21">
    <text x="89" y="436" fill="#ffac75">&gt;</text>
    <text x="119" y="436" fill="#efeedd">/hero play ode</text>
    <path d="M370 421v18" stroke="#c4f578" stroke-width="9"/>
  </g>

  <!-- An illustrated excerpt of Ode to Joy in standard guitar tuning. -->
  <g font-family="Menlo, Consolas, monospace">
    <text x="812" y="143" font-size="14" letter-spacing="2" fill="#a3b099">ODE TO JOY</text>
    <text x="1536" y="143" text-anchor="end" font-size="14" letter-spacing="2" fill="#a3b099">100 BPM</text>
    <g stroke="#536247" stroke-width="1.5">
      <path d="M847 196H1536M847 234H1536M847 272H1536M847 310H1536M847 348H1536M847 386H1536"/>
    </g>
    <g stroke="#43513a" stroke-dasharray="3 9">
      <path d="M1068 177V404M1175 177V404M1282 177V404M1389 177V404M1496 177V404"/>
    </g>
    <g fill="#a3b099" font-size="18" text-anchor="middle">
      <text x="820" y="202">e</text>
      <text x="820" y="240">B</text>
      <text x="820" y="278">G</text>
      <text x="820" y="316">D</text>
      <text x="820" y="354">A</text>
      <text x="820" y="392">E</text>
    </g>

    <rect x="853" y="177" width="108" height="227" fill="url(#trail)"/>
    <path d="M961 179V402" stroke="#c4f578" stroke-width="13" opacity=".45" filter="url(#glow)"/>
    <path d="M961 177V404" stroke="#c4f578" stroke-width="2.5"/>
    <path d="m951 166 10 11 10-11Z" fill="#c4f578"/>
    <path d="m951 415 10-11 10 11Z" fill="#c4f578"/>

    <path d="M887 310h42" stroke="#85a95c" stroke-width="5"/>
    <rect x="859" y="296" width="29" height="28" rx="4" fill="#263d22" stroke="#85a95c"/>
    <text x="873.5" y="317" text-anchor="middle" font-size="20" fill="#c4f578">2</text>

    <path d="M977 310h54" stroke="#c4f578" stroke-width="5"/>
    <rect x="943" y="292" width="36" height="36" rx="5" fill="#c4f578"/>
    <text x="961" y="317" text-anchor="middle" font-size="22" font-weight="700" fill="#172014">2</text>

    <g stroke="#d9ddc7" stroke-width="4">
      <path d="M1083 310h48M1190 272h48M1297 272h48M1404 310h48M1511 310h25"/>
    </g>
    <g fill="#1a241b" stroke="#d9ddc7" stroke-width="1.5">
      <rect x="1053" y="295" width="30" height="30" rx="4"/>
      <rect x="1160" y="257" width="30" height="30" rx="4"/>
      <rect x="1267" y="257" width="30" height="30" rx="4"/>
      <rect x="1374" y="295" width="30" height="30" rx="4"/>
      <rect x="1481" y="295" width="30" height="30" rx="4"/>
    </g>
    <g fill="#efeedd" font-size="20" text-anchor="middle">
      <text x="1068" y="317">3</text>
      <text x="1175" y="279">0</text>
      <text x="1282" y="279">0</text>
      <text x="1389" y="317">3</text>
      <text x="1496" y="317">2</text>
    </g>

    <text x="961" y="453" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#c4f578">PERFECT</text>
    <circle cx="1294" cy="447" r="4" fill="#ffac75"/>
    <text x="1536" y="453" text-anchor="end" font-size="16" fill="#a3b099">MIC ON · E3 +4¢</text>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="1.2">
    <text x="70" y="524" fill="#a3b099">TABS / CHORDS / LIVE SCORING</text>
    <text x="1536" y="524" text-anchor="end" fill="#ffac75">TURN WAIT TIME INTO PLAY TIME.</text>
  </g>
</svg>
